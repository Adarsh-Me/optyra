name: CI

on:
  push:
    branches: [main]
  pull_request:

# The gate keeps main deployable (02prd §6): ruff + pytest + docker build on every PR.
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: optyra
          POSTGRES_PASSWORD: optyra
          POSTGRES_DB: optyra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U optyra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://optyra:optyra@localhost:5432/optyra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t optyra:ci .
