# Optyra v2 — mission watch-set. The bot only searches INSIDE these orgs, and only
# their >= 10k-star repos (gate in config.yaml sync.min_stars). The list is the ONLY
# thing that changes when you retarget the bot — everything else is code.
#
#   orgs:          GitHub org logins. `org:X is:issue is:open created:>=...` per org,
#                  every poll cycle; the star gate is applied client-side against repo
#                  metadata (GitHub's search does not support `stars:` in issue queries —
#                  verified live 2026-09-03: `org:X + stars:>=N` returns ~0/1 nonsense).
#                  Orgs keep MULTIPLE qualifying repos where they exist: tensorflow ->
#                  tensorflow(199k) models(78k) tfjs(19k); python -> cpython(76k) mypy(21k).
#   pinned_repos:  'owner/name' watched regardless of stars, polled via one combined
#                  repo: OR-query every cycle. REQUIRED for laurent22/joplin (a personal
#                  USER account — invisible to org: queries no matter what); the
#                  nixpkgs/sdk pins also immune those repos to star-gate flicker.
#   blocked_owners: safety net applied post-search (never `-/org:` in queries — flaky).
#                  pytorch + rust-lang are the user's explicit exclusions; they are out
#                  by construction anyway since they're not in orgs.
#
# Rate math: 16 orgs + 1 combined pinned query = 17 search req / 180 s ~ 5.7 req/min
# (GitHub search cap 30/min; our self-cap 20/min). No tiers in v2: one lane, one rate.

watch:
  orgs:
    - tensorflow        # tensorflow 199k · models 78k · tfjs 19k
    - electron          # electron 123k
    - godotengine       # godot 117k   (NOT "godot")
    - google-gemini     # gemini-cli 107k  (NOT "google")
    - neovim            # neovim 116k
    - opencv            # opencv 91k
    - django            # django 90k
    - python            # cpython 76k · mypy 21k
    - swiftlang         # swift 70k    (moved from apple/)
    - webpack           # webpack 66k
    - FFmpeg            # FFmpeg 64k
    - git               # git 63k
    - llvm              # llvm-project 40k
    - jenkinsci         # jenkins 27k  (NOT "jenkins")
    - NixOS             # nixpkgs 26k
    - dart-lang         # sdk 11.3k    (also pinned below)
  pinned_repos:
    - laurent22/joplin  # 56k stars BUT owner.type=User -> org: can never see it
    - NixOS/nixpkgs     # policy pin: gate-flicker immunity
    - dart-lang/sdk     # policy pin: 11.3k sits near the 10k line
  blocked_owners:
    - pytorch
    - rust-lang
# NOTE: "Intel Video/Audio for Linux" was asked about and answered "no" by the user
# (2026-09) — neither Intel's media stack (1k★, fails the gate) nor VideoLAN is listed.
